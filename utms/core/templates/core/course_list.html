{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Courses</h2>
    <a class="btn btn-primary btn-sm" href="{% url 'core:course-add' %}">Add Course</a>
  </div>
  <table class="table table-bordered align-middle">
    <thead class="table-light">
      <tr><th>Code</th><th>Name</th><th>Credits</th><th>Department</th><th class="text-center">Actions</th></tr>
    </thead>
    <tbody>
      {% for c in courses %}
      <tr>
        <td>{{ c.code }}</td><td>{{ c.name }}</td><td>{{ c.credits }}</td><td>{{ c.department }}</td>
        <td class="text-center">
          <a class="btn btn-sm btn-warning" href="{% url 'core:course-edit' c.pk %}">Edit</a>
          <a class="btn btn-sm btn-danger" href="{% url 'core:course-delete' c.pk %}">Delete</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="5" class="text-muted">No courses yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
