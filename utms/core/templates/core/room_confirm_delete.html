{% extends 'base.html' %}
{% block content %}
<div class="container mt-4 col-md-5">
  <h2>Confirm delete</h2>
  <p>Are you sure you want to delete room <strong>{{ object }}</strong>?</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Delete</button>
    <a class="btn btn-secondary" href="{% url 'core:room-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
