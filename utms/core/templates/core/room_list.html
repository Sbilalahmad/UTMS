{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Rooms</h2>
    <a class="btn btn-primary btn-sm" href="{% url 'core:room-add' %}">Add Room</a>
  </div>
  <table class="table table-bordered align-middle">
    <thead class="table-light">
      <tr><th>Name</th><th>Capacity</th><th>Type</th><th class="text-center">Actions</th></tr>
    </thead>
    <tbody>
      {% for r in rooms %}
      <tr>
        <td>{{ r.name }}</td>
        <td>{{ r.capacity }}</td>
        <td>{{ r.get_type_display }}</td>
        <td class="text-center">
          <a class="btn btn-sm btn-warning" href="{% url 'core:room-edit' r.pk %}">Edit</a>
          <a class="btn btn-sm btn-danger" href="{% url 'core:room-delete' r.pk %}">Delete</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-muted">No rooms yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
