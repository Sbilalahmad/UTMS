{% extends 'base.html' %}{% load crispy_forms_tags %}
{% block content %}
<div class="container mt-4 col-md-5">
  <h2>{% if object %}Edit{% else %}New{% endif %} Timeslot</h2>
  <form method="post">{% csrf_token %}{{ form|crispy }}
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{% url 'core:timeslot-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
