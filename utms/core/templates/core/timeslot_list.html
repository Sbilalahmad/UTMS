{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Timeslots</h2>
    <a class="btn btn-primary btn-sm" href="{% url 'core:timeslot-add' %}">Add Timeslot</a>
  </div>
  <table class="table table-bordered align-middle">
    <thead class="table-light">
      <tr><th>Day</th><th>Start</th><th>End</th><th class="text-center">Actions</th></tr>
    </thead>
    <tbody>
      {% for t in timeslots %}
      <tr>
        <td>{{ t.day_of_week }}</td>
        <td>{{ t.start_time|time:"H:i" }}</td>
        <td>{{ t.end_time|time:"H:i" }}</td>
        <td class="text-center">
          <a class="btn btn-sm btn-warning" href="{% url 'core:timeslot-edit' t.pk %}">Edit</a>
          <a class="btn btn-sm btn-danger" href="{% url 'core:timeslot-delete' t.pk %}">Delete</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-muted">No timeslots yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
