{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Timetable – {{ semester }}</h2>
  <div class="table-responsive">
    <table class="table table-bordered align-middle">
      <thead class="table-light">
        <tr><th>Course</th><th>Faculty</th><th>Room</th><th>Timeslot</th></tr>
      </thead>
      <tbody>
        {% for s in schedules %}
        <tr>
          <td>{{ s.course.code }}</td>
          <td>{{ s.faculty.name }}</td>
          <td>{{ s.room.name }}</td>
          <td>{{ s.timeslot }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4" class="text-muted">No scheduled classes for this semester.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <a class="btn btn-secondary btn-sm" href="{% url 'scheduler:generate' %}">← Back</a>
</div>
{% endblock %}
