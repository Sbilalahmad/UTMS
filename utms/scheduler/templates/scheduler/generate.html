{% extends 'base.html' %}
{% block content %}
<div class="container mt-4 col-md-4">
  <h2>Generate Timetable</h2>
  <form method="post">
    {% csrf_token %}
    <label class="form-label">Semester</label>
    <select name="semester" class="form-select mb-3">
      <option>Fall</option><option>Spring</option><option>Summer</option>
    </select>
    <button class="btn btn-success">Generate</button>
    <a class="btn btn-secondary" href="{% url 'admin_dashboard' %}">Back</a>
  </form>
</div>
{% endblock %}
