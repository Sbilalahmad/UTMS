{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Notifications</h2>
  {% for n in notifications %}
    <div class="alert alert-info">{{ n.message }} <small class="text-muted">{{ n.created }}</small></div>
  {% empty %}
    <p>No notifications.</p>
  {% endfor %}
</div>
{% endblock %}
